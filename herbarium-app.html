<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Herbarium</title>
<style>
:root {
  --bg: #faf7f0;
  --panel: #ffffff;
  --ink: #2b2620;
  --muted: #6b6459;
  --line: #ddd5c7;
  --gold: #a8763a;
  --gold-bg: #f6ecd9;
  --sage: #6f7d5c;
  --sage-bg: #eef1e7;
  --accent-default: #8b3a2f;
  --radius: 10px;
  font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}

button { font-family: inherit; cursor: pointer; }
a { color: inherit; }

/* ---------- shared masthead (Field Guide / Diagram / Trainer / Field Log) ---------- */
.tr-masthead {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.app-switch {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 0.75rem 1.25rem;
  justify-content: space-between;
}
.app-title { font-weight: 700; font-size: 1.2rem; letter-spacing: 0.02em; }
.app-tabs { display: flex; gap: 0.4rem; }
.app-tabs button {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 0.4rem 0.9rem;
  font-size: 0.9rem;
  color: var(--muted);
}
.app-tabs button.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }

.tab-panel { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

/* ---------- status tags ---------- */
.status-tag {
  font-size: 0.7rem;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  white-space: nowrap;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.status-inguide { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold); }
.status-extension { background: transparent; color: var(--sage); border: 1px dashed var(--sage); }
.status-context { background: #efece4; color: var(--muted); border: 1px solid var(--line); }

/* ================= Diagram: recursive nested boxes ================= */
.ph-toolbar { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
.ph-toggle-all {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  padding: 0.35rem 0.8rem;
  font-size: 0.85rem;
}

.ph-events { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; }
.ph-event {
  font-size: 0.75rem;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.15rem 0.6rem;
}
.ph-header-event {
  font-size: 0.7rem;
  color: var(--muted);
  margin-left: auto;
}

.ph-group {
  --accent: var(--accent-default);
  border: calc(1px + (5 - min(var(--depth), 5)) * 0.25px) solid color-mix(in srgb, var(--accent) 55%, var(--line));
  border-radius: calc(var(--radius) - min(var(--depth), 4) * 1px);
  padding: calc(1rem - var(--depth) * 0.08rem) calc(1rem - var(--depth) * 0.05rem);
  margin-bottom: calc(0.9rem - var(--depth) * 0.05rem);
  background: color-mix(in srgb, var(--accent) calc(4% - var(--depth) * 0.3%), var(--panel));
}
.ph-group-head {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  margin-bottom: 0.6rem;
}
.ph-rank {
  font-size: calc(0.62rem + (5 - min(var(--depth), 5)) * 0.02rem);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.ph-name {
  margin: 0;
  font-size: calc(0.95rem + (6 - min(var(--depth), 6)) * 0.12rem);
  color: color-mix(in srgb, var(--accent) 70%, var(--ink));
}
.ph-group-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(calc(220px - var(--depth) * 4px), 1fr));
  gap: calc(0.75rem - var(--depth) * 0.04rem);
}

.ph-card {
  --accent: var(--accent-default);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 8px;
  padding: 0.7rem 0.8rem;
  background: var(--panel);
}
.ph-card[data-rank="order"] { border-width: 1.5px; }
.ph-card-top { display: flex; align-items: flex-start; gap: 0.55rem; }
.ph-card-text { flex: 1; min-width: 0; }
.ph-card .ph-name { font-size: 0.95rem; }
.ph-icon { width: 28px; height: 28px; flex: none; color: var(--accent); }

.ph-species { margin-top: 0.5rem; font-size: 0.8rem; }
.ph-species summary { cursor: pointer; color: var(--muted); }
.ph-species ul { margin: 0.35rem 0 0; padding-left: 1.1rem; columns: 2; }

/* ================= Field Guide ================= */
.fg-jump { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.fg-jump a {
  font-size: 0.78rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.2rem 0.65rem;
  text-decoration: none;
  color: var(--muted);
}
.fg-order { margin-bottom: 2.5rem; }
.fg-order-head { padding: 0.9rem 1rem; border-radius: var(--radius); margin-bottom: 0.9rem; }
.fg-order-icon { width: 40px; height: 40px; color: var(--gold); flex: none; }
.fg-rank { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.fg-order-head h3 { margin: 0.1rem 0 0; font-size: 1.4rem; }
.fg-desc { color: var(--muted); max-width: 62ch; margin-bottom: 1.2rem; }

.fg-family-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}
.fg-family {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
}
.fg-family-head { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.6rem; }
.fg-icon { width: 32px; height: 32px; color: var(--gold); flex: none; }
.fg-family-head h4 { margin: 0; font-size: 1.02rem; }
.fg-common { margin: 0.1rem 0 0; font-size: 0.8rem; color: var(--muted); }
.fg-trait { font-size: 0.85rem; margin: 0.4rem 0; }
.fg-differentia { font-size: 0.82rem; color: var(--muted); margin: 0 0 0.6rem; }
.fg-species { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--line); padding-top: 0.5rem; }
.fg-species li { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.82rem; padding: 0.15rem 0; }
.fg-sp-sci { font-style: italic; color: var(--muted); text-align: right; }

/* ================= Trainer ================= */
.tr-mode-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.tr-mode-btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.85rem;
  color: var(--muted);
}
.tr-mode-btn.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tr-score { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
.tr-quiz {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.5rem;
}
.tr-prompt { font-size: 1.05rem; margin-bottom: 1.2rem; text-align: center; }
.tr-icon-prompt { width: 72px; height: 72px; color: var(--gold); display: block; margin: 0 auto 0.6rem; }
.tr-clue { max-width: 46ch; margin: 0 auto; color: var(--muted); }
.tr-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.tr-option {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  font-size: 0.9rem;
  text-align: left;
}
.tr-option.correct { background: var(--sage-bg); border-color: var(--sage); }
.tr-option.wrong { background: #f6e3e0; border-color: #a33; }
.tr-reveal { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
.tr-why { font-size: 0.9rem; color: var(--muted); }
.tr-next {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--panel);
  border-radius: 999px;
  padding: 0.4rem 1rem;
  font-size: 0.85rem;
}
.tr-empty { color: var(--muted); }

/* ================= Field Log ================= */
.fl-form { display: grid; gap: 0.5rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem; }
.fl-form input, .fl-form textarea {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.5rem 0.6rem;
  font-family: inherit;
  font-size: 0.9rem;
}
.fl-form button {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--panel);
  border-radius: 999px;
  padding: 0.5rem;
  font-size: 0.9rem;
}
.fl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.fl-entry { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.9rem; }
.fl-entry-head { display: flex; align-items: center; gap: 0.6rem; }
.fl-date { color: var(--muted); font-size: 0.8rem; }
.fl-delete { margin-left: auto; border: none; background: none; font-size: 1.1rem; color: var(--muted); }
.fl-loc { font-size: 0.8rem; color: var(--muted); }
.fl-notes { font-size: 0.88rem; margin: 0.35rem 0 0; }
.fl-empty { color: var(--muted); }

@media (max-width: 640px) {
  .app-switch { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
  .tr-options { grid-template-columns: 1fr; }
  .ph-species ul { columns: 1; }
}

</style>
</head>

    <button type="button" data-tab="trainer">Trainer</button>
    <button type="button" data-tab="log">Field Log</button>

</nav>

<main id="panel-diagram" class="tab-panel" hidden></main>

            {

             "status": "context",

             "quizWhy": "Carrots, dill, and parsley all produce their tiny flowers in umbrella-shaped clusters called umbels.",

            {

             "icon": "<path d=\"M20 34V22\"/><path d=\"M20 22c-6-2-8-8-4-12 4 3 5 8 4 12z\"/><path d=\"M20 22c6-2 8-8 4-12-4 3-5 8-4 12z\"/>",
             "status": "context",

             "quizWhy": "Honeysuckle produces paired tubular flowers that grow directly from the same point on the stem.",
             "families": [],

             ]
            },
            {

             "rank": "order",
             "accent": "#8b3a2f",
             "icon": "<circle cx=\"20\" cy=\"20\" r=\"4\"/><path d=\"M20 12V6M20 34v-6M12 20H6M34 20h-6M14 14l-4-4M30 14l4-4M14 26l-4 4M30 26l4 4\"/>",
             "status": "extension",
             "quizClue": "A center disc ringed by many thin radiating lines &mdash; the most literal daisy shape in the set.",
             "quizWhy": "Daisies and sunflowers are composite flowers &mdash; what looks like one bloom is really a disc of many tiny flowers ringed by petal-like rays.",
             "families": [],
             "plants": [
              "Artichoke",
              "Burdock",
              "Topinambur",
              "Sunflower",
              "Chamomile",
              "Chicory",

 ]
};
</script>
<script>
// Shared helpers used by all four tab renderers. Single place for icon
// wrapping, escaping, and the order status-tag vocabulary so nothing is
// hand-duplicated per tab.
window.Herb = (function () {
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // path markup is trusted inline SVG authored in data/taxonomy.json, not
  // user input, so it is inserted verbatim (never escaped).
  function iconSvg(pathMarkup, cls) {
    return `<svg class="${cls || 'ic'}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">${pathMarkup || ''}</svg>`;
  }

  const STATUS_LABEL = {
    inguide: '✓ in guide',
    extension: 'extension pt.',
    context: 'not in guide',
  };

  function statusTag(status) {
    const key = STATUS_LABEL[status] ? status : 'context';
    return `<span class="status-tag status-${key}">${STATUS_LABEL[key]}</span>`;
  }

  // Depth-first walk over the taxonomy tree. visit(node, depth, parents)
  // may return false to skip descending into node.children.
  function walk(nodes, visit, depth = 0, parents = []) {
    for (const node of nodes) {
      const cont = visit(node, depth, parents);
      if (cont !== false && node.children) {
        walk(node.children, visit, depth + 1, [...parents, node]);
      }
    }
  }

  // Collect every rank:"order" node in document order.
  function collectOrders(tree) {
    const orders = [];
    walk(tree, (node) => {
      if (node.rank === 'order') orders.push(node);
    });
    return orders;
  }

  function eventsRowHtml(events) {
    if (!events || !events.length) return '';
    return `<div class="ph-events">${events
      .map((e) => `<span class="ph-event"><b>${esc(e.date)}</b> ${esc(e.label)}</span>`)
      .join('')}</div>`;
  }

  function headerEventHtml(headerEvent) {
    if (!headerEvent) return '';
    return `<span class="ph-header-event">${esc(headerEvent.date)} · ${esc(headerEvent.label)}</span>`;
  }

  return { esc, iconSvg, statusTag, STATUS_LABEL, walk, collectOrders, eventsRowHtml, headerEventHtml };
})();


// Field Guide tab: reference browser for plant taxonomy. Every order with
// a non-empty families[] is "built" and gets a header + family cards;
// orders without built families simply do not appear here. This keeps the
// Field Guide's membership a pure function of taxonomy.json - no separate
// "which orders are in the guide" list to keep in sync.
(function () {
  const { esc, iconSvg, collectOrders } = window.Herb;

  function speciesRowHtml(sp) {
    return `<li><span class="fg-sp-common">${esc(sp.common)}</span><span class="fg-sp-sci">${sp.sci}</span></li>`;
  }

  function familyCardHtml(family) {
    return `<article class="fg-family" id="fam-${esc(family.id)}">
      <div class="fg-family-head">
        ${iconSvg(family.icon, 'fg-icon')}
        <div>
          <h4>${esc(family.name)}</h4>
          <p class="fg-common">${esc(family.common)}</p>
        </div>
      </div>
      <p class="fg-trait"><b>Trait:</b> ${family.trait}</p>
      <p class="fg-differentia">${family.differentia}</p>
      <ul class="fg-species">${(family.species || []).map(speciesRowHtml).join('')}</ul>
    </article>`;
  }

  function orderSectionHtml(order) {
    return `<section class="fg-order" id="order-${esc(order.name.toLowerCase().replace(/\s+/g, '-'))}">
      <header class="fg-order-head tr-masthead">
        ${iconSvg(order.icon, 'fg-order-icon')}
        <div>
          <span class="fg-rank">Order</span>
          <h3>${esc(order.name)}</h3>
        </div>
      </header>
      <p class="fg-desc">${order.desc || ''}</p>
      <div class="fg-family-grid">${(order.families || []).map(familyCardHtml).join('')}</div>
    </section>`;
  }

  function renderFieldGuide(container, tree) {
    const built = collectOrders(tree).filter((o) => o.families && o.families.length);
    if (!built.length) {
      container.innerHTML = '<p class="fg-empty">No orders built out yet.</p>';
      return;
    }
    container.innerHTML = `
      <nav class="fg-jump">${built
        .map((o) => `<a href="#order-${esc(o.name.toLowerCase().replace(/\s+/g, '-'))}">${esc(o.name)}</a>`)
        .join('')}</nav>
      <div class="fg-orders">${built.map(orderSectionHtml).join('')}</div>
    `;
  }

  window.Herb = window.Herb || {};
  window.Herb.renderFieldGuide = renderFieldGuide;
})();


// Diagram tab: recursive nested-box map of the plant kingdom. One function,
// renderNode(node, depth, inheritedAccent) - a node with `children` becomes
// a bordered container (.ph-group), a node without becomes a specimen card
// (.ph-card). Depth-based sizing is driven entirely by the CSS custom
// property --depth (see styles.css); this function never special-cases
// rendering by rank or by hand-picked pixel values, so adding a family
// under an order, or a species under a family, needs zero changes here.
(function () {
  const { esc, iconSvg, statusTag, walk, eventsRowHtml, headerEventHtml } = window.Herb;

  function speciesListHtml(list) {
    if (!list || !list.length) return '';
    return `<details class="ph-species">
      <summary>${list.length} tagged plant${list.length === 1 ? '' : 's'}</summary>
      <ul>${list.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
    </details>`;
  }

  function familyChipsHtml(families) {
    if (!families || !families.length) return '';
    return `<details class="ph-species">
      <summary>${families.length} famil${families.length === 1 ? 'y' : 'ies'} built</summary>
      <ul>${families.map((f) => `<li>${esc(f.common || f.name)}</li>`).join('')}</ul>
    </details>`;
  }

  function renderNode(node, depth, inheritedAccent) {
    const accent = node.accent || inheritedAccent;
    const style = accent ? ` style="--accent:${esc(accent)}"` : '';
    const isOrder = node.rank === 'order';
    const eventsHtml = eventsRowHtml(node.events);

    if (node.children && node.children.length) {
      const inner = node.children
        .map((child) => renderNode(child, depth + 1, accent))
        .join('');
      return `${eventsHtml}<section class="ph-group" data-rank="${esc(node.rank)}" style="--depth:${depth};${accent ? `--accent:${esc(accent)}` : ''}">
        <header class="ph-group-head">
          <span class="ph-rank">${esc(node.rank)}</span>
          <h3 class="ph-name">${esc(node.name)}</h3>
          ${headerEventHtml(node.headerEvent)}
        </header>
        <div class="ph-group-body">${inner}</div>
      </section>`;
    }

    // Leaf node: order-rank cards get icon + status tag + species/family
    // toggle; non-order leaves (informal groups with no children) get a
    // lighter card.
    const icon = node.icon ? iconSvg(node.icon, 'ph-icon') : '';
    const tag = isOrder ? statusTag(node.status) : '';
    const list = isOrder ? familyChipsHtml(node.families) || speciesListHtml(node.plants) : speciesListHtml(node.plants);

    return `${eventsHtml}<article class="ph-card" data-rank="${esc(node.rank)}" style="--depth:${depth};${accent ? `--accent:${esc(accent)}` : ''}">
      <div class="ph-card-top">
        ${icon}
        <div class="ph-card-text">
          <span class="ph-rank">${esc(node.rank)}</span>
          <h4 class="ph-name">${esc(node.name)}</h4>
        </div>
        ${tag}
      </div>
      ${list}
    </article>`;
  }

  function renderDiagram(container, tree) {
    container.innerHTML = `
      <div class="ph-toolbar">
        <button type="button" class="ph-toggle-all" data-action="expand">Expand all</button>
        <button type="button" class="ph-toggle-all" data-action="collapse">Collapse all</button>
      </div>
      <div class="ph-root">${tree.map((n) => renderNode(n, 0, n.accent)).join('')}</div>
    `;

    const root = container.querySelector('.ph-root');
    container.querySelectorAll('.ph-toggle-all').forEach((btn) => {
      btn.addEventListener('click', () => {
        const open = btn.dataset.action === 'expand';
        root.querySelectorAll('details.ph-species').forEach((d) => { d.open = open; });
      });
    });
  }

  window.Herb = window.Herb || {};
  window.Herb.renderDiagram = renderDiagram;
})();


// Trainer tab: quiz/study game built from the same taxonomy tree.
// 4 modes, all reading taxonomy.json directly (no separate quiz data file):
//   1. Species -> Family   2. Family -> Order   3. Species -> Order
//   4. Icon -> Order (uses order.quizClue / order.quizWhy)
(function () {
  const { esc, iconSvg, collectOrders } = window.Herb;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick(arr, n, exclude) {
    const pool = arr.filter((x) => x !== exclude);
    return shuffle(pool).slice(0, n);
  }

  function buildPools(tree) {
    const orders = collectOrders(tree).filter((o) => o.families && o.families.length);
    const families = [];
    const species = [];
    for (const order of orders) {
      for (const fam of order.families) {
        families.push({ ...fam, orderName: order.name });
        for (const sp of fam.species || []) {
          species.push({ ...sp, familyName: fam.common || fam.name, orderName: order.name });
        }
      }
    }
    const iconOrders = collectOrders(tree).filter((o) => o.quizClue && o.icon);
    return { orders, families, species, iconOrders };
  }

  function questionSpeciesToFamily(pools) {
    const target = pools.species[Math.floor(Math.random() * pools.species.length)];
    const distractors = pick(pools.families.map((f) => f.common || f.name), 3, target.familyName);
    const options = shuffle([target.familyName, ...distractors]);
    return {
      prompt: `Which family does <b>${esc(target.common)}</b> (<i>${target.sci}</i>) belong to?`,
      options, answer: target.familyName,
      why: `${esc(target.common)} is placed in ${esc(target.familyName)}, order ${esc(target.orderName)}.`,
    };
  }

  function questionFamilyToOrder(pools) {
    const target = pools.families[Math.floor(Math.random() * pools.families.length)];
    const distractors = pick(pools.orders.map((o) => o.name), 3, target.orderName);
    const options = shuffle([target.orderName, ...distractors]);
    return {
      prompt: `${target.trait}<br><br>Which order does the <b>${esc(target.common || target.name)}</b> family (${esc(target.name)}) belong to?`,
      options, answer: target.orderName,
      why: target.differentia,
    };
  }

  function questionSpeciesToOrder(pools) {
    const target = pools.species[Math.floor(Math.random() * pools.species.length)];
    const distractors = pick(pools.orders.map((o) => o.name), 3, target.orderName);
    const options = shuffle([target.orderName, ...distractors]);
    return {
      prompt: `Which order does <b>${esc(target.common)}</b> (<i>${target.sci}</i>) belong to?`,
      options, answer: target.orderName,
      why: `${esc(target.common)} sits in the ${esc(target.familyName)} family, order ${esc(target.orderName)}.`,
    };
  }

  function questionIconToOrder(pools) {
    const target = pools.iconOrders[Math.floor(Math.random() * pools.iconOrders.length)];
    const distractors = pick(pools.iconOrders.map((o) => o.name), 3, target.name);
    const options = shuffle([target.name, ...distractors]);
    return {
      prompt: `${iconSvg(target.icon, 'tr-icon-prompt')}<div class="tr-clue">${target.quizClue}</div>`,
      options, answer: target.name, why: target.quizWhy,
    };
  }

  const MODES = {
    species_family: { label: 'Species → Family', build: questionSpeciesToFamily, needs: (p) => p.species.length >= 4 },
    family_order: { label: 'Family → Order', build: questionFamilyToOrder, needs: (p) => p.families.length >= 4 && p.orders.length >= 4 },
    species_order: { label: 'Species → Order', build: questionSpeciesToOrder, needs: (p) => p.species.length >= 1 && p.orders.length >= 4 },
    icon_order: { label: 'Icon → Order', build: questionIconToOrder, needs: (p) => p.iconOrders.length >= 4 },
  };

  function renderTrainer(container, tree) {
    const pools = buildPools(tree);
    const state = { mode: 'icon_order', score: 0, asked: 0, current: null };

    container.innerHTML = `
      <div class="tr-mode-row">${Object.entries(MODES)
        .map(([key, m]) => `<button type="button" class="tr-mode-btn" data-mode="${key}">${m.label}</button>`)
        .join('')}</div>
      <div class="tr-score">Score: <span class="tr-score-val">0</span> / <span class="tr-asked-val">0</span></div>
      <div class="tr-quiz"></div>
    `;

    const quizEl = container.querySelector('.tr-quiz');
    const scoreEl = container.querySelector('.tr-score-val');
    const askedEl = container.querySelector('.tr-asked-val');

    function setMode(key) {
      state.mode = key;
      container.querySelectorAll('.tr-mode-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === key);
      });
      nextQuestion();
    }

    function nextQuestion() {
      const mode = MODES[state.mode];
      if (!mode.needs(pools)) {
        quizEl.innerHTML = '<p class="tr-empty">Not enough built data for this mode yet.</p>';
        return;
      }
      const q = mode.build(pools);
      state.current = q;
      quizEl.innerHTML = `
        <div class="tr-prompt">${q.prompt}</div>
        <div class="tr-options">${q.options
          .map((opt) => `<button type="button" class="tr-option" data-opt="${esc(opt)}">${esc(opt)}</button>`)
          .join('')}</div>
        <div class="tr-reveal" hidden></div>
      `;
      quizEl.querySelectorAll('.tr-option').forEach((btn) => {
        btn.addEventListener('click', () => answer(btn.dataset.opt));
      });
    }

    function answer(choice) {
      const q = state.current;
      const correct = choice === q.answer;
      state.asked += 1;
      if (correct) state.score += 1;
      scoreEl.textContent = state.score;
      askedEl.textContent = state.asked;

      quizEl.querySelectorAll('.tr-option').forEach((btn) => {
        btn.disabled = true;
        if (btn.dataset.opt === q.answer) btn.classList.add('correct');
        else if (btn.dataset.opt === choice) btn.classList.add('wrong');
      });
      const reveal = quizEl.querySelector('.tr-reveal');
      reveal.hidden = false;
      reveal.innerHTML = `<p class="tr-why">${correct ? 'Correct. ' : `Answer: ${esc(q.answer)}. `}${q.why}</p>
        <button type="button" class="tr-next">Next question</button>`;
      reveal.querySelector('.tr-next').addEventListener('click', nextQuestion);
    }

    container.querySelectorAll('.tr-mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });
    setMode(state.mode);
  }

  window.Herb = window.Herb || {};
  window.Herb.renderTrainer = renderTrainer;
})();


// Field Log tab: private log of user-found plants. Unlike the other three
// tabs this reads/writes only window.storage (localStorage-backed) and
// never touches taxonomy.json - it is personal data, not shared facts.
(function () {
  const { esc } = window.Herb;
  const STORAGE_KEY = 'herbarium.fieldLog.v1';

  window.storage = window.storage || {
    get() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    },
    set(entries) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (e) { /* storage unavailable (private browsing, quota) */ }
    },
  };

  function entryHtml(entry, idx) {
    return `<li class="fl-entry" data-idx="${idx}">
      <div class="fl-entry-head">
        <b>${esc(entry.name)}</b>
        <span class="fl-date">${esc(entry.date || '')}</span>
        <button type="button" class="fl-delete" data-idx="${idx}" aria-label="Delete entry">&times;</button>
      </div>
      ${entry.location ? `<div class="fl-loc">${esc(entry.location)}</div>` : ''}
      ${entry.notes ? `<p class="fl-notes">${esc(entry.notes)}</p>` : ''}
    </li>`;
  }

  function renderFieldLog(container) {
    function draw() {
      const entries = window.storage.get();
      container.innerHTML = `
        <form class="fl-form">
          <input type="text" name="name" placeholder="Plant name" required />
          <input type="date" name="date" />
          <input type="text" name="location" placeholder="Location (optional)" />
          <textarea name="notes" placeholder="Notes (optional)"></textarea>
          <button type="submit">Add entry</button>
        </form>
        <ul class="fl-list">${entries
          .slice()
          .reverse()
          .map((e, i) => entryHtml(e, entries.length - 1 - i))
          .join('') || '<li class="fl-empty">No plants logged yet.</li>'}</ul>
      `;

      container.querySelector('.fl-form').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const name = fd.get('name').trim();
        if (!name) return;
        const current = window.storage.get();
        current.push({
          name,
          date: fd.get('date') || '',
          location: fd.get('location').trim(),
          notes: fd.get('notes').trim(),
        });
        window.storage.set(current);
        draw();
      });

      container.querySelectorAll('.fl-delete').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          const current = window.storage.get();
          current.splice(idx, 1);
          window.storage.set(current);
          draw();
        });
      });
    }
    draw();
  }

  window.Herb = window.Herb || {};
  window.Herb.renderFieldLog = renderFieldLog;
})();


// Wires up tab switching (#appSwitch) and lazily calls each tab's renderer
// the first time it's shown. Works both in dev (fetches data/taxonomy.json)
// and in the concatenated build (reads the inlined window.TAXONOMY_DATA).
(function () {
  function boot(data) {
    const tree = data.tree;
    const rendered = { guide: false, diagram: false, trainer: false, log: false };
    const panels = {
      guide: document.getElementById('panel-field-guide'),
      diagram: document.getElementById('panel-diagram'),
      trainer: document.getElementById('panel-trainer'),
      log: document.getElementById('panel-field-log'),
    };

    function show(tab) {
      Object.entries(panels).forEach(([key, el]) => {
        el.hidden = key !== tab;
      });
      document.querySelectorAll('#appSwitch [data-tab]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      if (!rendered[tab]) {
        rendered[tab] = true;
        if (tab === 'guide') window.Herb.renderFieldGuide(panels.guide, tree);
        if (tab === 'diagram') window.Herb.renderDiagram(panels.diagram, tree);
        if (tab === 'trainer') window.Herb.renderTrainer(panels.trainer, tree);
        if (tab === 'log') window.Herb.renderFieldLog(panels.log);
      }
    }

    document.querySelectorAll('#appSwitch [data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => show(btn.dataset.tab));
    });

    show('guide');
  }

  if (window.TAXONOMY_DATA) {
    boot(window.TAXONOMY_DATA);
  } else {
    fetch('data/taxonomy.json')
      .then((r) => r.json())
      .then(boot)
      .catch((err) => {
        document.body.innerHTML = `<p style="padding:2rem;color:#a33">Failed to load taxonomy.json: ${err.message}</p>`;
      });
  }
})();

</script>
