<script>
// Shared helpers used by all four tab renderers. Single place for icon
// wrapping, escaping, and tree traversal so nothing is hand-duplicated
// per tab. There is no guide-status concept in this app - every order
// and informal group is equally "in the guide" - so this file carries
// no status vocabulary of any kind.
window.Herb = (function () {
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // path markup is trusted inline SVG authored in data/taxonomy.json, not
  // user input, so it is inserted verbatim (never escaped).
  function iconSvg(pathMarkup, cls) {
    return `<svg class="${cls || ''}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">${pathMarkup || ''}</svg>`;
  }

  // Depth-first walk over the taxonomy tree. visit(node, depth, parents)
  // may return false to skip descending into node.children.
  function walk(nodes, visit, depth = 0, parents = []) {
    for (const node of nodes) {
      const cont = visit(node, depth, parents);
      if (cont !== false && node.children) {
        walk(node.children, visit, depth + 1, [...parents, node]);
      }
    }
  }

  // Collect every order and informal-group node, in document order. These
  // are the two ranks that can carry families[] - rank is a taxonomic
  // label only, so this checks rank membership, never field presence vs.
  // rank as a gate for what a renderer is allowed to show.
  function collectGroups(tree) {
    const groups = [];
    walk(tree, (node) => {
      if (node.rank === 'order' || node.rank === 'informal group') groups.push(node);
    });
    return groups;
  }

  function eventsRowHtml(events) {
    if (!events || !events.length) return '';
    return `<div class="ph-event-row">${events
      .map((e) => `<span class="ph-event-chip"><span class="ph-event-chip-date">${esc(e.date)}</span><span class="ph-event-chip-name">${esc(e.label)}</span></span>`)
      .join('')}</div>`;
  }

  return {
    esc, iconSvg, walk, collectGroups, eventsRowHtml,
  };
})();


// Field Guide tab: reference browser for plant taxonomy. Every order or
// informal group with a non-empty families[] is "built" and gets a header
// + family cards; nodes without built families simply do not appear here.
// This keeps the Field Guide's membership a pure function of
// taxonomy.json - no separate "what's in the guide" list to keep in sync,
// and no guide-status tag of any kind (there is no longer a distinction
// between what's "in" the guide and what isn't - everything built is in).
(function () {
  const { esc, iconSvg, collectGroups } = window.Herb;

  function speciesRowHtml(sp) {
    return `<li id="sp-${esc(sp.id)}"><span class="common">${esc(sp.common)}</span><span class="sci">${sp.sci}</span></li>`;
  }

  function familyCardHtml(family) {
    return `<article class="family-card" id="fam-${esc(family.id)}" data-family="${esc(family.name)}">
      <div class="card-top">
        <div class="fam-titles">
          <h3 class="fam-name">${esc(family.name)}</h3>
          <div class="fam-common">${esc(family.common)}</div>
        </div>
        ${iconSvg(family.icon, 'leaf-icon')}
      </div>
      <p class="trait">${family.trait}</p>
      <p class="differentia"><b>Sets it apart:</b> ${family.differentia}</p>
      ${family.species && family.species.length
        ? `<ul class="species-list">${family.species.map(speciesRowHtml).join('')}</ul>`
        : ''}
    </article>`;
  }

  function groupSectionHtml(group, index) {
    const plate = String(index + 1).padStart(2, '0');
    const accent = group.accent || '#c79a2b';
    return `<section class="order" id="order-${esc(group.id)}" data-group="${esc(group.name)}" style="--accent:${esc(accent)}">
      <div class="order-head">
        <div class="order-title-group">
          ${iconSvg(group.icon, 'order-icon')}
          <div>
            <span class="fg-rank">${esc(group.rank)}</span>
            <h2 class="order-name">${esc(group.name)}</h2>
          </div>
        </div>
        <span class="plate">Plate No. ${plate}</span>
      </div>
      <p class="order-traits">${group.desc || ''}</p>
      <div class="family-grid">${(group.families || []).map(familyCardHtml).join('')}</div>
    </section>`;
  }

  function renderFieldGuide(container, tree) {
    const built = collectGroups(tree).filter((g) => g.families && g.families.length);
    const orderCount = built.filter((g) => g.rank === 'order').length;
    const groupCount = built.filter((g) => g.rank === 'informal group').length;
    const header = `<header class="masthead">
      <div class="eyebrow">Herbarium Edition &middot; Volume I</div>
      <h1 class="title">A Field Guide to the <em>Plant Kingdom</em></h1>
      <div class="subtitle">${orderCount} ORDERS <span class="dot">&middot;</span> ${groupCount} INFORMAL GROUPS <span class="dot">&middot;</span> ${built.reduce((n, g) => n + g.families.length, 0)} FAMILIES <span class="dot">&middot;</span> ${built.reduce((n, g) => n + g.families.reduce((m, f) => m + (f.species ? f.species.length : 0), 0), 0)} SPECIES</div>
    </header>`;

    if (!built.length) {
      container.innerHTML = `${header}<p style="text-align:center;color:var(--sage);padding:60px 24px;">Nothing built out yet.</p>`;
      return;
    }

    container.innerHTML = `
      ${header}
      <nav class="fg-jump">${built.map((g) => `<a href="#order-${esc(g.id)}" style="--accent:${esc(g.accent || '#c79a2b')}">${esc(g.name)}</a>`).join('')}</nav>
      <main>${built.map((g, i) => groupSectionHtml(g, i)).join('')}</main>
    `;
  }

  window.Herb = window.Herb || {};
  window.Herb.renderFieldGuide = renderFieldGuide;
})();


// Diagram tab: recursive nested-box map of the plant kingdom. One function,
// renderNode(node, depth, inheritedAccent) - a node with `children` becomes
// a bordered container (.ph-group), a node without becomes a specimen card
// (.ph-card). Depth-based sizing is driven entirely by the CSS custom
// property --depth (see styles.css); this function never special-cases
// rendering by rank or by hand-picked pixel values, so adding a family
// under an order, or a species under a family, needs zero changes here.
(function () {
  const { esc, iconSvg, eventsRowHtml } = window.Herb;

  function chipsToggleHtml(labels, summaryText) {
    if (!labels || !labels.length) return '';
    return `<details class="ph-species-toggle">
      <summary><span class="ph-species-chevron">&#9662;</span>${summaryText}</summary>
      <div class="ph-species-list">${labels.map((l) => `<span class="ph-species-chip">${esc(l)}</span>`).join('')}</div>
    </details>`;
  }

  // Checked by field presence, not rank - any leaf node (order or
  // informal group) can carry families[], and any not-yet-built node can
  // carry a plain plants[] list instead.
  // The toggle summary itself already says "N families" - repeating
  // "family" on every chip beneath it is redundant and, at this compact
  // size, costs more space than it's worth. Every family's `common` name
  // in the data ends in "family"/"Family" by convention, so this trim is
  // safe without special-casing individual families.
  function trimFamilySuffix(label) {
    return label.replace(/\s+family$/i, '');
  }

  function leafExtrasHtml(node) {
    if (node.families && node.families.length) {
      const labels = node.families.map((f) => trimFamilySuffix(f.common || f.name));
      return chipsToggleHtml(labels, `${labels.length} famil${labels.length === 1 ? 'y' : 'ies'}`);
    }
    if (node.plants && node.plants.length) {
      return chipsToggleHtml(node.plants, `${node.plants.length} tagged plant${node.plants.length === 1 ? '' : 's'}`);
    }
    return '';
  }

  function renderNode(node, depth, inheritedAccent) {
    const accent = node.accent || inheritedAccent;
    const eventsHtml = eventsRowHtml(node.events);
    const dateTag = node.headerEvent ? `<span class="ph-group-date">${esc(node.headerEvent.date)} &middot; ${esc(node.headerEvent.label)}</span>` : '';

    if (node.children && node.children.length) {
      const inner = node.children.map((child) => renderNode(child, depth + 1, accent)).join('');
      return `${eventsHtml}<div class="ph-group" id="diag-${esc(node.id)}" style="--depth:${depth};${accent ? `--accent:${esc(accent)}` : ''}">
        <div class="ph-group-head">
          <span class="ph-group-rank">${esc(node.rank)}</span>
          <h3 class="ph-group-title">${esc(node.name)}</h3>
          ${dateTag}
        </div>
        <div class="ph-group-body">${inner}</div>
      </div>`;
    }

    const icon = node.icon ? iconSvg(node.icon, 'ph-card-icon') : '';
    const extras = leafExtrasHtml(node);

    return `${eventsHtml}<div class="ph-card" id="diag-${esc(node.id)}" style="--depth:${depth};${accent ? `--accent:${esc(accent)}` : ''}">
      ${icon}
      <span class="ph-card-rank">${esc(node.rank)}</span>
      <span class="ph-card-name">${esc(node.name)}</span>
      ${extras}
    </div>`;
  }

  function renderDiagram(container, tree) {
    container.innerHTML = `
      <header class="tr-masthead">
        <div class="eyebrow">Herbarium Edition &middot; Diagram</div>
        <h1 class="tr-title">Where the Orders <em>Fit</em></h1>
        <div class="tip">A nested map of the plant kingdom, from the origin of life to every order in this field guide.</div>
      </header>
      <div class="tr-main ph-main">
        <div class="ph-caveat">
          <b>A caveat on the first few boxes.</b> Brown Algae, Red Algae, Green Algae, Bryophytes, and Ferns
          are <b>not taxonomic orders</b> like the rest of this guide &mdash; each is tagged &ldquo;informal
          group&rdquo; rather than &ldquo;order&rdquo; below, since they sit at a much higher, less precise rank.
          Brown Algae in particular sits on an entirely different branch of the tree of life than green plants do;
          they're placed near each other here only to sketch when photosynthetic life diversified before true land
          plants existed.
          <br><br>
          <b>A caveat on the dates.</b> Boxes run oldest to youngest, top to bottom and outer to inner. Divergence
          dates for ancient splits come from molecular-clock and fossil studies that often disagree by tens of
          millions of years &mdash; treat the dates on the rust-colored tags as commonly-cited estimates, not precise
          figures.
        </div>
        <div class="ph-species-controls">
          <button type="button" id="phExpandAll" class="ph-species-btn">Expand all</button>
          <button type="button" id="phCollapseAll" class="ph-species-btn">Collapse all</button>
        </div>
        <div id="phyloTree" class="ph-tree">${tree.map((n) => renderNode(n, 0, n.accent)).join('')}</div>
      </div>
    `;

    const root = container.querySelector('#phyloTree');
    container.querySelector('#phExpandAll').addEventListener('click', () => {
      root.querySelectorAll('details.ph-species-toggle').forEach((d) => { d.open = true; });
    });
    container.querySelector('#phCollapseAll').addEventListener('click', () => {
      root.querySelectorAll('details.ph-species-toggle').forEach((d) => { d.open = false; });
    });
  }

  window.Herb = window.Herb || {};
  window.Herb.renderDiagram = renderDiagram;
})();


// Trainer tab: quiz/study game built from the same taxonomy tree, no
// separate quiz-data file. Seven modes: Species -> Family, Species -> Group,
// Family -> Order, Spot the Difference (differentia -> family), Icon ->
// Order, Illustration -> Species, and a non-quiz Study/Browse mode for
// flipping through a chosen order's families.
(function () {
  const { esc, iconSvg, collectGroups } = window.Herb;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pick(arr, n, exclude) {
    return shuffle(arr.filter((x) => x !== exclude)).slice(0, n);
  }

  // "orders" here also includes the 5 informal groups (Brown Algae etc.) -
  // they carry families[]/quizClue/icon exactly like an order does, and
  // are quizzed/browsed identically. Rank is a taxonomic label shown in
  // the UI, not a gate on what content or quiz modes a node takes part in.
  function buildPools(tree) {
    const orders = collectGroups(tree).filter((o) => o.families && o.families.length);
    const families = [];
    const species = [];
    for (const order of orders) {
      for (const fam of order.families) {
        if (!fam.species || !fam.species.length) continue;
        families.push({ ...fam, orderName: order.name, orderRank: order.rank });
        for (const sp of fam.species) {
          species.push({
            ...sp, familyName: fam.name, orderName: order.name, orderRank: order.rank,
          });
        }
      }
    }
    const iconOrders = collectGroups(tree).filter((o) => o.quizClue && o.icon);
    const illustratedSpecies = species.filter((sp) => sp.illustration);
    return {
      orders, families, species, iconOrders, illustratedSpecies,
    };
  }

  function questionSpeciesToFamily(pools) {
    const target = pools.species[Math.floor(Math.random() * pools.species.length)];
    const options = shuffle([target.familyName, ...pick(pools.families.map((f) => f.name), 3, target.familyName)]);
    return {
      label: 'Species &rarr; Family', icon: null,
      main: esc(target.common), sub: target.sci,
      text: `Which family does this belong to?`,
      options, answer: target.familyName,
      why: `${esc(target.common)} sits in ${esc(target.familyName)}, ${esc(target.orderRank)} ${esc(target.orderName)}.`,
    };
  }

  function questionSpeciesToOrder(pools) {
    const target = pools.species[Math.floor(Math.random() * pools.species.length)];
    const options = shuffle([target.orderName, ...pick(pools.orders.map((o) => o.name), 3, target.orderName)]);
    return {
      label: 'Species &rarr; Group', icon: null,
      main: esc(target.common), sub: target.sci,
      text: `Which ${target.orderRank} does this belong to?`,
      options, answer: target.orderName,
      why: `${esc(target.common)} sits in ${esc(target.familyName)}, ${esc(target.orderRank)} ${esc(target.orderName)}.`,
    };
  }

  function questionFamilyToOrder(pools) {
    const target = pools.families[Math.floor(Math.random() * pools.families.length)];
    const options = shuffle([target.orderName, ...pick(pools.orders.map((o) => o.name), 3, target.orderName)]);
    return {
      label: 'Family &rarr; Group', icon: null,
      main: esc(target.name), sub: target.common,
      text: target.trait,
      options, answer: target.orderName,
      why: target.differentia,
    };
  }

  function questionDifferentia(pools) {
    const target = pools.families[Math.floor(Math.random() * pools.families.length)];
    const siblings = pools.families.filter((f) => f.orderName === target.orderName && f.name !== target.name);
    const distractorPool = siblings.length >= 3 ? siblings : pools.families;
    const options = shuffle([target.name, ...pick(distractorPool.map((f) => f.name), 3, target.name)]);
    return {
      label: 'Spot the Difference', icon: null,
      main: 'Which family is this?', sub: '',
      text: target.differentia,
      options, answer: target.name,
      why: `${esc(target.name)} (${esc(target.common)}) &mdash; ${target.trait}`,
    };
  }

  function questionIconToGroup(pools) {
    const target = pools.iconOrders[Math.floor(Math.random() * pools.iconOrders.length)];
    const options = shuffle([target.name, ...pick(pools.iconOrders.map((o) => o.name), 3, target.name)]);
    return {
      label: 'Icon &rarr; Group', icon: target.icon,
      main: '', sub: '',
      text: target.quizClue,
      options, answer: target.name,
      why: target.quizWhy,
    };
  }

  function questionIllustrationToSpecies(pools) {
    const target = pools.illustratedSpecies[Math.floor(Math.random() * pools.illustratedSpecies.length)];
    const options = shuffle([target.common, ...pick(pools.illustratedSpecies.map((s) => s.common), 3, target.common)]);
    return {
      label: 'Illustration &rarr; Species', icon: null, illustration: target.illustration.svg,
      main: '', sub: '',
      text: 'Which species does this illustration show?',
      options, answer: target.common,
      why: `${esc(target.common)} (${esc(target.sci)}) &mdash; ${target.illustration.caption}`,
    };
  }

  const MODES = {
    species: { label: 'Species &rarr; Family', build: questionSpeciesToFamily, needs: (p) => p.species.length >= 4 },
    speciesOrder: { label: 'Species &rarr; Group', build: questionSpeciesToOrder, needs: (p) => p.species.length >= 4 && p.orders.length >= 4 },
    family: { label: 'Family &rarr; Group', build: questionFamilyToOrder, needs: (p) => p.families.length >= 4 && p.orders.length >= 4 },
    differentia: { label: 'Spot the Difference', build: questionDifferentia, needs: (p) => p.families.length >= 4 },
    icon: { label: 'Icon &rarr; Group', build: questionIconToGroup, needs: (p) => p.iconOrders.length >= 4 },
    illustration: { label: 'Illustration &rarr; Species', build: questionIllustrationToSpecies, needs: (p) => p.illustratedSpecies.length >= 4 },
  };

  function studyCardHtml(family) {
    return `<div class="study-card">
      <div class="study-card-top">${iconSvg(family.icon)}<div>
        <div class="study-fam-name">${esc(family.name)}</div>
        <div class="study-fam-common">${esc(family.common)}</div>
      </div></div>
      <p class="study-trait">${family.trait}</p>
      <p class="study-differentia">${family.differentia}</p>
      <div class="study-species">${(family.species || []).map((sp) => `<span>${esc(sp.common)}</span>`).join('')}</div>
    </div>`;
  }

  function renderTrainer(container, tree) {
    const pools = buildPools(tree);
    const state = { mode: 'icon', correct: 0, answered: 0, streak: 0, best: 0, current: null, studyOrder: null };

    container.innerHTML = `
      <header class="tr-masthead">
        <div class="eyebrow">Companion to the Field Guide</div>
        <h1 class="tr-title">The <em>Herbarium</em> Trainer</h1>
        <p class="tip">Cycle through all six quiz modes each session instead of mastering one at a time &mdash; interleaving species, families, and groups builds stronger recall than drilling one relationship on its own.</p>
      </header>
      <div class="stats-bar">
        <div class="stat"><span class="stat-num" id="statCorrect">0</span><span class="stat-label">Correct</span></div>
        <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Answered</span></div>
        <div class="stat"><span class="stat-num" id="statStreak">0</span><span class="stat-label">Streak</span></div>
        <div class="stat"><span class="stat-num" id="statBest">0</span><span class="stat-label">Best Streak</span></div>
      </div>
      <nav class="modes">${Object.entries(MODES).map(([key, m]) => `<button type="button" data-mode="${key}">${m.label}</button>`).join('')}<button type="button" data-mode="study">Study / Browse</button></nav>
      <div class="tr-main">
        <div id="quizArea" class="quiz-wrap"></div>
        <div id="studyArea" class="hidden">
          <div class="order-chips" id="orderChips"></div>
          <p class="study-order-desc" id="studyOrderDesc"></p>
          <div class="study-grid" id="studyGrid"></div>
        </div>
      </div>
    `;

    const quizArea = container.querySelector('#quizArea');
    const studyArea = container.querySelector('#studyArea');
    const statCorrect = container.querySelector('#statCorrect');
    const statTotal = container.querySelector('#statTotal');
    const statStreak = container.querySelector('#statStreak');
    const statBest = container.querySelector('#statBest');

    function setMode(key) {
      state.mode = key;
      container.querySelectorAll('nav.modes button').forEach((b) => b.classList.toggle('active', b.dataset.mode === key));
      if (key === 'study') {
        quizArea.classList.add('hidden');
        studyArea.classList.remove('hidden');
        renderStudy();
      } else {
        studyArea.classList.add('hidden');
        quizArea.classList.remove('hidden');
        nextQuestion();
      }
    }

    function nextQuestion() {
      const mode = MODES[state.mode];
      if (!mode.needs(pools)) {
        quizArea.innerHTML = '<p class="tr-empty">Not enough built data for this mode yet.</p>';
        return;
      }
      const q = mode.build(pools);
      state.current = q;
      quizArea.innerHTML = `
        <div class="prompt-card">
          <div class="prompt-label">${q.label}</div>
          ${q.icon ? iconSvg(q.icon, 'prompt-icon') : ''}
          ${q.illustration ? `<div class="prompt-illustration">${q.illustration}</div>` : ''}
          ${q.main ? `<div class="prompt-main">${q.main}</div>` : ''}
          ${q.sub ? `<div class="prompt-sub">${q.sub}</div>` : ''}
          <p class="prompt-text">${q.text}</p>
        </div>
        <div class="answers">${q.options.map((opt) => `<button type="button" class="answer-btn" data-opt="${esc(opt)}"><span class="a-name">${esc(opt)}</span></button>`).join('')}</div>
        <div class="feedback hidden" id="feedback"></div>
        <button type="button" class="next-btn hidden" id="nextBtn">Next</button>
      `;
      quizArea.querySelectorAll('.answer-btn').forEach((btn) => btn.addEventListener('click', () => answer(btn.dataset.opt)));
      quizArea.querySelector('#nextBtn').addEventListener('click', nextQuestion);
    }

    function answer(choice) {
      const q = state.current;
      const correct = choice === q.answer;
      state.answered += 1;
      if (correct) { state.correct += 1; state.streak += 1; state.best = Math.max(state.best, state.streak); }
      else { state.streak = 0; }
      statCorrect.textContent = state.correct;
      statTotal.textContent = state.answered;
      statStreak.textContent = state.streak;
      statBest.textContent = state.best;

      quizArea.querySelectorAll('.answer-btn').forEach((btn) => {
        btn.disabled = true;
        if (btn.dataset.opt === q.answer) btn.classList.add('correct');
        else if (btn.dataset.opt === choice) btn.classList.add('wrong');
      });
      const feedback = quizArea.querySelector('#feedback');
      feedback.classList.remove('hidden');
      feedback.innerHTML = `${correct ? '<b>Correct.</b>' : `<b>Answer: ${esc(q.answer)}.</b>`} ${q.why}`;
      quizArea.querySelector('#nextBtn').classList.remove('hidden');
    }

    function renderStudy() {
      const chipsEl = container.querySelector('#orderChips');
      if (!chipsEl.dataset.built) {
        chipsEl.dataset.built = '1';
        chipsEl.innerHTML = pools.orders.map((o) => `<button type="button" class="order-chip" style="--chip-color:${esc(o.accent || '#c79a2b')}" data-order="${esc(o.name)}">${esc(o.name)}</button>`).join('');
        chipsEl.querySelectorAll('.order-chip').forEach((btn) => btn.addEventListener('click', () => showStudyOrder(btn.dataset.order)));
      }
      if (!state.studyOrder) showStudyOrder(pools.orders[0].name);
    }

    function showStudyOrder(name) {
      state.studyOrder = name;
      const order = pools.orders.find((o) => o.name === name);
      container.querySelectorAll('.order-chip').forEach((b) => b.classList.toggle('active', b.dataset.order === name));
      container.querySelector('#studyOrderDesc').innerHTML = order.desc || '';
      container.querySelector('#studyGrid').innerHTML = (order.families || []).map(studyCardHtml).join('');
    }

    container.querySelectorAll('nav.modes button').forEach((btn) => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
    setMode(state.mode);
  }

  window.Herb = window.Herb || {};
  window.Herb.renderTrainer = renderTrainer;
})();


// Field Log tab: private log of user-found plants. Reads the taxonomy tree
// only to build the species picker (so a logged sighting can reference a
// real species/family/order) - the log entries themselves live only in
// window.storage (localStorage-backed) and are never written back into
// taxonomy.json. This is personal data, not a shared fact.
(function () {
  const { esc, collectGroups } = window.Herb;
  const STORAGE_KEY = 'herbarium.fieldLog.v1';

  window.storage = window.storage || {
    get() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    },
    set(entries) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      } catch (e) { /* storage unavailable (private browsing, quota) */ }
    },
  };

  function speciesOptionsHtml(tree) {
    let html = '<option value="custom">Other / not in guide&hellip;</option>';
    for (const order of collectGroups(tree)) {
      for (const fam of order.families || []) {
        if (!fam.species || !fam.species.length) continue;
        html += `<optgroup label="${esc(order.name)} — ${esc(fam.name)}">`;
        for (const sp of fam.species) {
          const value = esc(JSON.stringify({ common: sp.common, sci: sp.sci, family: fam.name, order: order.name }));
          html += `<option value="${value}">${esc(sp.common)}</option>`;
        }
        html += '</optgroup>';
      }
    }
    return html;
  }

  function entryCardHtml(entry, idx) {
    const tags = [entry.family, entry.order].filter(Boolean);
    return `<div class="fl-card" data-idx="${idx}">
      <div class="fl-card-top">
        <div>
          <span class="fl-name">${esc(entry.common)}</span>
          ${entry.sci ? `<span class="fl-sci"> &mdash; ${entry.sci}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="fl-date">${esc(entry.date || '')}</span>
          <button type="button" class="fl-delete" data-idx="${idx}" aria-label="Delete entry">&times;</button>
        </div>
      </div>
      ${tags.length ? `<div class="fl-tags">${tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      ${entry.location ? `<div class="fl-location">${esc(entry.location)}</div>` : ''}
      ${entry.notes ? `<p class="fl-notes">${esc(entry.notes)}</p>` : ''}
    </div>`;
  }

  function renderFieldLog(container, tree) {
    function stats(entries) {
      const species = new Set(entries.map((e) => e.common).filter(Boolean));
      const families = new Set(entries.map((e) => e.family).filter(Boolean));
      const orders = new Set(entries.map((e) => e.order).filter(Boolean));
      return { total: entries.length, species: species.size, families: families.size, orders: orders.size };
    }

    function draw() {
      const entries = window.storage.get();
      const s = stats(entries);
      container.innerHTML = `
        <header class="tr-masthead">
          <div class="eyebrow">Your Private Log</div>
          <h1 class="tr-title">The <em>Field</em> Log</h1>
          <p class="tip">Every sighting you add here is saved privately to this app &mdash; nothing is shared or uploaded anywhere else.</p>
        </header>
        <div class="stats-bar">
          <div class="stat"><span class="stat-num">${s.total}</span><span class="stat-label">Sightings</span></div>
          <div class="stat"><span class="stat-num">${s.species}</span><span class="stat-label">Species</span></div>
          <div class="stat"><span class="stat-num">${s.families}</span><span class="stat-label">Families</span></div>
          <div class="stat"><span class="stat-num">${s.orders}</span><span class="stat-label">Groups</span></div>
        </div>
        <div class="tr-main">
          <form id="flForm" class="fl-form">
            <div class="fl-field">
              <label for="flSpeciesSelect">Species</label>
              <select id="flSpeciesSelect">${speciesOptionsHtml(tree)}</select>
            </div>
            <div class="fl-field hidden" id="flCustomWrap">
              <label for="flCustomName">Species name</label>
              <input type="text" id="flCustomName" placeholder="e.g. Trillium grandiflorum" />
            </div>
            <div class="fl-row">
              <div class="fl-field">
                <label for="flDate">Date found</label>
                <input type="date" id="flDate" />
              </div>
              <div class="fl-field">
                <label for="flLocation">Location</label>
                <input type="text" id="flLocation" placeholder="e.g. Riverside trail, north bank" />
              </div>
            </div>
            <div class="fl-field">
              <label for="flNotes">Notes</label>
              <textarea id="flNotes" rows="2" placeholder="Anything worth remembering &mdash; condition, habitat, identifying features"></textarea>
            </div>
            <button type="submit" class="fl-submit">Add Sighting</button>
          </form>
          <div class="fl-list">${entries.slice().reverse().map((e, i) => entryCardHtml(e, entries.length - 1 - i)).join('') || ''}</div>
          ${!entries.length ? '<p class="fl-empty">No sightings logged yet &mdash; add the first one above.</p>' : ''}
        </div>
      `;

      const select = container.querySelector('#flSpeciesSelect');
      const customWrap = container.querySelector('#flCustomWrap');
      select.addEventListener('change', () => {
        customWrap.classList.toggle('hidden', select.value !== 'custom');
      });

      container.querySelector('#flForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const customName = container.querySelector('#flCustomName');
        let entry;
        if (select.value === 'custom') {
          if (!customName.value.trim()) return;
          entry = { common: customName.value.trim(), sci: '', family: '', order: '' };
        } else {
          entry = JSON.parse(select.value);
        }
        entry.date = container.querySelector('#flDate').value || '';
        entry.location = container.querySelector('#flLocation').value.trim();
        entry.notes = container.querySelector('#flNotes').value.trim();

        const current = window.storage.get();
        current.push(entry);
        window.storage.set(current);
        draw();
      });

      container.querySelectorAll('.fl-delete').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          const current = window.storage.get();
          current.splice(idx, 1);
          window.storage.set(current);
          draw();
        });
      });
    }
    draw();
  }

  window.Herb = window.Herb || {};
  window.Herb.renderFieldLog = renderFieldLog;
})();


// Discover tab: a vertical snap-scroll feed of one-fact-per-card plant
// trivia, built once per load by flattening every funFacts[] entry found
// anywhere in the tree (order/informal-group/clade, family, species) into a
// flat card pool. Unseen cards are shuffled ahead of seen ones on every
// open; only the seen-set itself persists (in localStorage), never a fixed
// queue order.
(function () {
  const { esc, iconSvg, walk } = window.Herb;

  const SEEN_KEY = 'df-seen';

  const TYPE_LABELS = {
    height: 'Height', region_found: 'Region found', region_origin: 'Region origin',
    pollination: 'Pollination', interspecies: 'Interspecies', culinary: 'Culinary',
    cultural: 'Cultural', medicinal: 'Medicinal', discovery: 'Discovery', cultivation: 'Cultivation',
    chemical: 'Chemical', other: 'Fact',
  };
  const TYPE_COLORS = {
    height: '#5f7a8a', region_found: '#6f7d5c', region_origin: '#a8763a',
    pollination: '#c79a2b', interspecies: '#8b3a2f', culinary: '#e0b74a',
    cultural: '#8a9678', medicinal: '#4c7a4c', discovery: '#a4453a', cultivation: '#5c7a3f',
    chemical: '#6b5b95', other: '#8a9678',
  };
  // Small hand-drawn glyphs for the category badge - a distinct, smaller
  // icon set from the per-taxon icons used elsewhere on the card (§4 in the
  // main brief). Rendered on their own 0 0 24 24 viewBox, never conflated
  // with the 0 0 40 40 taxon icon system in iconSvg().
  const TYPE_GLYPHS = {
    height: '<path d="M12 3v18M9 6l3-3 3 3M9 18l3 3 3-3"/>',
    region_found: '<path d="M12 21s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
    region_origin: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/>',
    pollination: '<circle cx="12" cy="12" r="2"/><circle cx="8" cy="8" r="2.5"/><circle cx="16" cy="8" r="2.5"/><circle cx="8" cy="16" r="2.5"/><circle cx="16" cy="16" r="2.5"/>',
    interspecies: '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',
    culinary: '<ellipse cx="12" cy="7" rx="4" ry="5"/><path d="M12 12v9"/>',
    cultural: '<path d="M6 3v18M6 4h10l-3 4 3 4H6"/>',
    medicinal: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>',
    discovery: '<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>',
    cultivation: '<path d="M3 18h18"/><path d="M12 18v-7"/><path d="M12 11c-3.2 0-5.5-2.3-5.5-5.5 3.2 0 5.5 2.3 5.5 5.5zM12 11c3.2 0 5.5-2.3 5.5-5.5-3.2 0-5.5 2.3-5.5 5.5z"/>',
    chemical: '<path d="M9 3h6M10 3v6.5l-5.2 8.7A1.8 1.8 0 006.4 21h11.2a1.8 1.8 0 001.6-2.8L14 9.5V3"/><path d="M8.2 15h7.6"/>',
    other: '<path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9"/>',
  };

  function badgeGlyphSvg(type) {
    return `<svg class="df-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${TYPE_GLYPHS[type] || TYPE_GLYPHS.other}</svg>`;
  }

  // Species-detail illustrations: a second, additive visual tier on top of
  // the funFacts badge system above. An `organ` label reuses the .df-badge
  // pill styling (a distinct color) with one shared "illustration" glyph
  // (analogous to chemical's beaker) followed by the organ name - not a
  // fact-type badge, since an illustration isn't a funFacts entry. See the
  // Species Detail Illustrations brief, "Discover card rendering".
  const ORGAN_LABELS = {
    flower: 'Flower', leaf: 'Leaf', fruit: 'Fruit', root: 'Root', stem: 'Stem', shoot: 'Shoot', seed: 'Seed',
  };
  const ORGAN_BADGE_COLOR = '#c79a6b';
  const ILLUSTRATION_GLYPH = '<rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M4 17l5-5 4 4 3-3 4 4"/>';
  function illustrationGlyphSvg() {
    return `<svg class="df-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${ILLUSTRATION_GLYPH}</svg>`;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Flatten every funFacts entry in the tree into one card per fact. Built
  // once per load and kept in memory - never rebuilt per scroll.
  //
  // Every card carries a `breadcrumb`: the chain of ancestor clade names,
  // then (for family/species cards) the owning order/informal-group name,
  // then (for species cards) the family name - so a card always shows where
  // it sits in the tree, not just its own name. `walk`'s third callback
  // argument is the node's ancestor chain (root-first, node itself
  // excluded), which is exactly this breadcrumb's clade portion once
  // filtered to rank === 'clade'.
  function buildCardPool(tree) {
    const cards = [];

    function pushNodeCard(level, rankLabel, node, breadcrumb) {
      if (!node.icon) return; // §4: iconless node with facts - skip rather than assume
      (node.funFacts || []).forEach((fact, i) => {
        cards.push({
          cardId: `${level}:${node.id}:${i}`,
          level, rankLabel,
          name: node.name, common: null, sci: null,
          icon: node.icon,
          breadcrumb,
          factType: fact.type, factText: fact.text,
          navTarget: node.id,
          diagramTarget: node.id, // order/informal-group/clade cards link to themselves in the Diagram
        });
      });
    }

    walk(tree, (node, depth, parents) => {
      const ancestryClades = parents.filter((p) => p.rank === 'clade').map((p) => p.name);

      if (node.rank === 'order') pushNodeCard('order', 'Order', node, ancestryClades);
      else if (node.rank === 'informal group') pushNodeCard('informalGroup', 'Informal group', node, ancestryClades);
      else if (node.rank === 'clade') pushNodeCard('clade', 'Clade', node, ancestryClades);

      // families[] only ever lives on order/informal-group nodes
      // (collectGroups' rule elsewhere in the app) - the group breadcrumb
      // below, and the Diagram target every family/species card under this
      // node points at, are only meaningful when node is one of those two
      // ranks.
      const groupBreadcrumb = (node.rank === 'order' || node.rank === 'informal group')
        ? [...ancestryClades, node.name]
        : ancestryClades;
      const groupDiagramTarget = (node.rank === 'order' || node.rank === 'informal group') ? node.id : null;

      for (const fam of (node.families || [])) {
        (fam.funFacts || []).forEach((fact, i) => {
          cards.push({
            cardId: `family:${fam.id}:${i}`,
            level: 'family', rankLabel: 'Family',
            name: fam.name, common: fam.common, sci: null,
            icon: fam.icon,
            breadcrumb: groupBreadcrumb,
            factType: fact.type, factText: fact.text,
            navTarget: fam.id,
            diagramTarget: groupDiagramTarget, // families have no box of their own in the Diagram - link to their order/informal group
          });
        });
        for (const sp of (fam.species || [])) {
          (sp.funFacts || []).forEach((fact, i) => {
            cards.push({
              cardId: `species:${sp.id}:${i}`,
              level: 'species', rankLabel: 'Species',
              name: sp.common, common: sp.common, sci: sp.sci,
              icon: fam.icon, // species carry no icon of their own - use the parent family's
              breadcrumb: [...groupBreadcrumb, fam.name],
              factType: fact.type, factText: fact.text,
              navTarget: sp.id,
              diagramTarget: groupDiagramTarget, // same reasoning as family cards above
            });
          });
          // Species-detail illustration (optional, additive) - never on
          // family/order/informal-group/clade entries, per the brief's
          // scope rule. A separate card from any funFacts this species
          // also has, not a replacement or merge.
          if (sp.illustration) {
            cards.push({
              cardId: `species:${sp.id}:illustration`,
              level: 'species', rankLabel: 'Species',
              name: sp.common, common: sp.common, sci: sp.sci,
              isIllustration: true,
              organ: sp.illustration.organ,
              illustrationSvg: sp.illustration.svg,
              caption: sp.illustration.caption,
              breadcrumb: [...groupBreadcrumb, fam.name],
              navTarget: sp.id,
              diagramTarget: groupDiagramTarget,
            });
          }
        }
      }
    });

    return cards;
  }

  function loadSeen() {
    try {
      const raw = localStorage.getItem(SEEN_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) {
      return new Set();
    }
  }

  function saveSeen(seenSet) {
    try {
      localStorage.setItem(SEEN_KEY, JSON.stringify([...seenSet]));
    } catch (e) { /* storage unavailable - seen-tracking degrades gracefully */ }
  }

  // Unseen cards first (shuffled), then seen cards (shuffled) - rebuilt
  // fresh every time the tab opens, per the brief. Only the seen-set itself
  // is durable.
  function buildFeedOrder(allCards, seenSet) {
    const unseen = allCards.filter((c) => !seenSet.has(c.cardId));
    const seen = allCards.filter((c) => seenSet.has(c.cardId));
    return [...shuffle(unseen), ...shuffle(seen)];
  }

  // Field Guide anchor id for a card's navTarget, per the id prefixes that
  // section already uses (order-/fam-/sp-). Clade-level cards have no Field
  // Guide entry at all (Field Guide only renders order/informal-group
  // sections), so there is nothing to link to.
  function fieldGuideAnchorId(card) {
    if (card.level === 'order' || card.level === 'informalGroup') return `order-${card.navTarget}`;
    if (card.level === 'family') return `fam-${card.navTarget}`;
    if (card.level === 'species') return `sp-${card.navTarget}`;
    return null;
  }

  // Diagram anchor id for a card's diagramTarget - the order/informal-group
  // or clade box this card belongs under (families and species have no box
  // of their own in the Diagram, so they resolve to their owning
  // order/informal group; see buildCardPool).
  function diagramAnchorId(card) {
    return card.diagramTarget ? `diag-${card.diagramTarget}` : null;
  }

  function nameHtml(card) {
    if (card.level === 'species') {
      return `<h2 class="df-name">${esc(card.common)}</h2><div class="df-sci">${esc(card.sci)}</div>`;
    }
    if (card.level === 'family') {
      return `<h2 class="df-name">${esc(card.name)}</h2><div class="df-common">${esc(card.common)}</div>`;
    }
    return `<h2 class="df-name">${esc(card.name)}</h2>`;
  }

  // Rendered narrowest-first (species/family end) to broadest-last (clade
  // end) - the reverse of `breadcrumb`'s own root-first order - so it reads
  // as "this, within this, within this" rather than starting from the most
  // abstract ancestor.
  function breadcrumbHtml(card) {
    if (!card.breadcrumb || !card.breadcrumb.length) return '';
    const narrowestFirst = card.breadcrumb.slice().reverse();
    return `<div class="df-breadcrumb">${narrowestFirst.map((n) => `<span>${esc(n)}</span>`).join('<span class="df-breadcrumb-sep">&lsaquo;</span>')}</div>`;
  }

  function cardHtml(card) {
    const guideAnchor = fieldGuideAnchorId(card);
    const diagramAnchor = diagramAnchorId(card);
    const viewLinksHtml = `<div class="df-viewlinks">
        ${guideAnchor ? `<button type="button" class="df-viewlink" data-tab="guide" data-anchor="${esc(guideAnchor)}">View in Field Guide &rarr;</button>` : ''}
        ${diagramAnchor ? `<button type="button" class="df-viewlink" data-tab="diagram" data-anchor="${esc(diagramAnchor)}">View in Diagram &rarr;</button>` : ''}
      </div>`;

    if (card.isIllustration) {
      // card.illustrationSvg is trusted, author-supplied markup (same trust
      // level as taxonomy.json's icon paths elsewhere), inserted verbatim.
      return `<div class="df-card" data-card-id="${esc(card.cardId)}">
      <div class="df-illustration">${card.illustrationSvg}</div>
      <div class="df-rank">${esc(card.rankLabel)}</div>
      ${nameHtml(card)}
      ${breadcrumbHtml(card)}
      <span class="df-badge" style="--badge-color:${ORGAN_BADGE_COLOR}">${illustrationGlyphSvg()}${esc(ORGAN_LABELS[card.organ] || card.organ)}</span>
      <p class="df-fact">${esc(card.caption)}</p>
      ${viewLinksHtml}
    </div>`;
    }

    return `<div class="df-card" data-card-id="${esc(card.cardId)}">
      ${iconSvg(card.icon, 'df-icon')}
      <div class="df-rank">${esc(card.rankLabel)}</div>
      ${nameHtml(card)}
      ${breadcrumbHtml(card)}
      <span class="df-badge" style="--badge-color:${esc(TYPE_COLORS[card.factType] || TYPE_COLORS.other)}">${badgeGlyphSvg(card.factType)}${esc(TYPE_LABELS[card.factType] || TYPE_LABELS.other)}</span>
      <p class="df-fact">${esc(card.factText)}</p>
      ${viewLinksHtml}
    </div>`;
  }

  function renderDiscover(container, tree) {
    const pool = buildCardPool(tree);

    if (!pool.length) {
      container.innerHTML = '<p class="df-empty">No facts yet &mdash; check back once the Discover feed has content.</p>';
      return;
    }

    const seenSet = loadSeen();
    const order = buildFeedOrder(pool, seenSet);

    container.innerHTML = `<div class="df-feed" id="dfFeed">${order.map(cardHtml).join('')}</div>`;

    const feedEl = container.querySelector('#dfFeed');

    feedEl.querySelectorAll('.df-viewlink').forEach((btn) => {
      btn.addEventListener('click', () => {
        const anchorId = btn.dataset.anchor;
        const tabBtn = document.querySelector(`#appSwitch button[data-tab="${btn.dataset.tab}"]`);
        if (tabBtn) tabBtn.click();

        // The target tab's font-display:swap webfonts (Fraunces/Source
        // Serif 4/Space Mono) can still be loading the first time a long
        // tab like Field Guide or Diagram renders, and the resulting
        // reflow after the initial scroll can leave the target hundreds of
        // px off - hence needing a manual scroll to "find" it. Re-run the
        // same scroll once webfonts are actually ready, plus a couple of
        // fixed-delay fallbacks for engines without the Font Loading API
        // or any other late reflow (e.g. iOS Safari's chrome collapsing
        // mid-scroll). A no-op re-scroll (already in place) is harmless.
        const attempt = () => {
          const el = document.getElementById(anchorId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        requestAnimationFrame(() => {
          attempt();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(attempt);
          setTimeout(attempt, 350);
          setTimeout(attempt, 900);
        });
      });
    });

    // Seen-tracking: a card counts as seen once it scrolls off the top of
    // the viewport (exits with its top edge above 0), not merely once it
    // has been visible. Writes are debounced rather than flushed every tick.
    let pendingWrite = null;
    const newlySeen = new Set(seenSet);
    function scheduleSave() {
      if (pendingWrite) clearTimeout(pendingWrite);
      pendingWrite = setTimeout(() => saveSeen(newlySeen), 400);
    }
    const observer = new IntersectionObserver((entries) => {
      let changed = false;
      for (const entry of entries) {
        if (!entry.isIntersecting && entry.boundingClientRect.top < 0) {
          const id = entry.target.dataset.cardId;
          if (!newlySeen.has(id)) { newlySeen.add(id); changed = true; }
        }
      }
      if (changed) scheduleSave();
    }, { root: feedEl, threshold: 0 });
    feedEl.querySelectorAll('.df-card').forEach((el) => observer.observe(el));
  }

  window.Herb = window.Herb || {};
  window.Herb.renderDiscover = renderDiscover;
})();


// Wires up tab switching (#appSwitch) and lazily calls each tab's renderer
// the first time it's shown. Works both in dev (fetches data/taxonomy.json)
// and in the concatenated build (reads the inlined window.TAXONOMY_DATA).
(function () {
  function boot(data) {
    const tree = data.tree;
    const rendered = { guide: false, diagram: false, trainer: false, log: false };
    const panels = {
      guide: document.getElementById('panel-field-guide'),
      diagram: document.getElementById('panel-diagram'),
      trainer: document.getElementById('panel-trainer'),
      log: document.getElementById('panel-field-log'),
      discover: document.getElementById('panel-discover'),
    };

    function show(tab) {
      Object.entries(panels).forEach(([key, el]) => {
        el.hidden = key !== tab;
      });
      document.querySelectorAll('#appSwitch [data-tab]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      // Discover reshuffles its feed order fresh every time the tab opens
      // (only the seen-set persists), so it re-renders on every visit
      // rather than being cached like the other tabs.
      if (tab === 'discover') {
        window.Herb.renderDiscover(panels.discover, tree);
      } else if (!rendered[tab]) {
        rendered[tab] = true;
        if (tab === 'guide') window.Herb.renderFieldGuide(panels.guide, tree);
        if (tab === 'diagram') window.Herb.renderDiagram(panels.diagram, tree);
        if (tab === 'trainer') window.Herb.renderTrainer(panels.trainer, tree);
        if (tab === 'log') window.Herb.renderFieldLog(panels.log, tree);
      }
    }

    document.querySelectorAll('#appSwitch [data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => show(btn.dataset.tab));
    });

    show('discover');
  }

  if (window.TAXONOMY_DATA) {
    boot(window.TAXONOMY_DATA);
  } else {
    fetch('data/taxonomy.json')
      .then((r) => r.json())
      .then(boot)
      .catch((err) => {
        document.body.innerHTML = `<p style="padding:2rem;color:#a33">Failed to load taxonomy.json: ${err.message}</p>`;
      });
  }
})();

</script>
</body>
</html>
